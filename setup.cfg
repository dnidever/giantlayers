[metadata]
name = giantlayers
version = 0.1.0a1
description = Experimental spherical LTE model atmospheres for cool giant stars
long_description = file: README.md
long_description_content_type = text/markdown
url = https://github.com/dnidever/giantlayers
license = MIT
project_urls =
    Documentation = https://giantlayers.readthedocs.io/
    Issues = https://github.com/dnidever/giantlayers/issues
license_files = LICENSE
classifiers =
    Development Status :: 3 - Alpha
    Programming Language :: Python :: 3
    Topic :: Scientific/Engineering :: Astronomy

[options]
python_requires = >=3.9
packages = find:
package_dir =
    = src

[options.packages.find]
where = src

[options.package_data]
giantlayers = spherical_kernel.c
giantlayers.data = barklem_collet.json
giantlayers.examples =
    continuum-wavelengths.dat
    solar-gs98.json

[options.extras_require]
exomol = h5py

[options.entry_points]
console_scripts =
    giantlayers = giantlayers.cli:main
