[metadata]
name = giantlayers
version = 0.1.0a1
description = Experimental spherical LTE model atmospheres for cool giant stars
long_description = file: README.md
long_description_content_type = text/markdown
url = https://github.com/dnidever/giantlayers
license = MIT
license_files = LICENSE
classifiers =
    Development Status :: 3 - Alpha
    Programming Language :: Python :: 3
    Topic :: Scientific/Engineering :: Astronomy

[options]
python_requires = >=3.9
packages = giantlayers_data
package_dir =
    giantlayers_data = data
py_modules =
    atlas9_odf
    audit_resolution
    benchmark_sampling
    collision_induced
    compare_atmospheres
    compare_marcs_flux
    exomol_import
    giantlayers
    gray_atmosphere
    hminus
    lte_chemistry
    lte_opacity
    marcs_atomic_lines
    marcs_model
    marcs_opacity
    marcs_writer
    mixing_length
    molecular_cross_section
    native_marcs
    native_transfer
    nonlinear_atmosphere
    odf_transfer
    opacity_table
    spherical_heating
    spherical_hydrostatic
    spherical_kernel_loader
    spherical_transfer
    two_group_atmosphere

[options.package_data]
giantlayers_data = barklem_collet.json

[options.extras_require]
exomol = h5py

[options.entry_points]
console_scripts =
    giantlayers = giantlayers:main
