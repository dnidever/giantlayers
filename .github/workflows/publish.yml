name: Build wheels and publish to PyPI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  wheels:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            arch: x86_64
          - os: ubuntu-24.04-arm
            arch: aarch64
          - os: macos-15-intel
            arch: x86_64
          - os: macos-15
            arch: arm64
          - os: windows-latest
            arch: AMD64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: pypa/cibuildwheel@v3.3.0
        env:
          CIBW_ARCHS: ${{ matrix.arch }}
      - uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.os }}
          path: wheelhouse/*.whl
          if-no-files-found: error

  source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install build twine
      - name: Build the fallback wheel and source distribution
        env:
          GIANTLAYERS_PURE_PYTHON: "1"
        run: python -m build
      - name: Check the compiler-free fallback
        working-directory: ${{ runner.temp }}
        run: |
          python -m pip install --only-binary=:all: "$GITHUB_WORKSPACE"/dist/*-py3-none-any.whl
          python -c 'from giantlayers.spherical_kernel_loader import bundled_kernel_path; assert bundled_kernel_path() is None'
          giantlayers --help
      - run: python -m twine check --strict dist/*
      - name: Check release tag
        if: github.event_name == 'release'
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          python -c 'import os; from importlib.metadata import version; assert os.environ["RELEASE_TAG"] == "v" + version("giantlayers")'
      - uses: actions/upload-artifact@v4
        with:
          name: source
          path: dist/*
          if-no-files-found: error

  publish:
    if: github.event_name == 'release'
    needs: [wheels, source]
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist/
          merge-multiple: true
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
