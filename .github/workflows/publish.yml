name: Publish to PyPI

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install build twine
      - run: python -m build
      - run: python -m twine check --strict dist/*
      - name: Check release tag and installed wheel
        working-directory: ${{ runner.temp }}
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          python -m pip install "$GITHUB_WORKSPACE"/dist/*.whl
          python -c 'import os; from importlib.metadata import version; assert os.environ["RELEASE_TAG"] == "v" + version("giantlayers")'
          giantlayers --help
          EXAMPLE_DIR=$(python -c "from importlib.resources import files; print(files('giantlayers_examples'))")
          giantlayers "$EXAMPLE_DIR/continuum-wavelengths.dat" "$EXAMPLE_DIR/solar-gs98.json" \
            --teff 3500 --logg 1 --mass 1 --layers 12 --upper-knots 4 \
            --steps 1 --output-model trial.mod > trial.csv
          test -s trial.mod && test -s trial.csv
      - uses: actions/upload-artifact@v4
        with:
          name: distributions
          path: dist/
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: distributions
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
